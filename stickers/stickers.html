<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=512">
  <meta name="robots" content="noindex">
  <title>Стикеры бота</title>
  <!-- Стикеры бота (ADR-005) в стиле DESIGN.md: пастель, чёрный контур, белая «вырезанная» кайма.
       Не экран: tools/render_stickers.js снимает stickers.html?s=<имя> в stickers/<имя>.webp, 512×512.
       Без ?s= — все стикеры на одном листе, для просмотра -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@700;800&family=Unbounded:wght@800&display=block">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: transparent; color: #000; font-family: "Onest", system-ui, sans-serif; }
    body.sheet { background: #dceeff; display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
    body.sheet .st { display: block !important; background: #fff; border: 1px solid #000; border-radius: 28px; }

    .st { position: relative; width: 512px; height: 512px; overflow: hidden; display: none; }
    /* кайма наклейки: белая обводка 14px и тонкий чёрный край по силуэту всего, что внутри */
    .cut { position: absolute; inset: 0; filter: url(#diecut); }
    .cut > * { position: absolute; }

    .uni { font-family: "Unbounded", sans-serif; font-weight: 800; line-height: .9; letter-spacing: -0.01em; }
    .pill {
      border: 4px solid #000; border-radius: 9999px; padding: 10px 26px 12px;
      font: 800 34px/1 "Onest", sans-serif; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
    }
    .ribbon path { fill: none; stroke-linecap: round; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="diecut" x="-10%" y="-10%" width="120%" height="120%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="14" result="w"/>
      <feFlood flood-color="#fff"/><feComposite in2="w" operator="in" result="white"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="17" result="b"/>
      <feFlood flood-color="#000"/><feComposite in2="b" operator="in" result="black"/>
      <feMerge><feMergeNode in="black"/><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="puck" viewBox="0 0 120 80"><path d="M8 30 v18 a52 22 0 0 0 104 0 v-18 z" fill="#000"/><ellipse cx="60" cy="30" rx="52" ry="22" fill="#000" stroke="#fff" stroke-width="4"/></symbol>
    <symbol id="star" viewBox="0 0 100 100"><path d="m50 6 12.5 27 29.5 3.5-22 20 6 29.5L50 71 23.5 86l6-29.5-22-20L37 33z" fill="#ffd731" stroke="#000" stroke-width="5" stroke-linejoin="round"/></symbol>
    <symbol id="stick" viewBox="0 0 200 300"><path d="M18 8 L112 236 Q122 262 150 262 L190 262 L190 290 L140 290 Q100 290 86 254 L-6 18 Z" fill="#e9ccff" stroke="#000" stroke-width="6" stroke-linejoin="round"/><path d="M60 118 l24 -10 M72 148 l24 -10" stroke="#000" stroke-width="6" stroke-linecap="round"/></symbol>
  </svg>

  <!-- hello: приветствие на /start -->
  <div class="st" id="hello">
    <div class="cut">
      <svg class="ribbon" style="left:28px;top:96px;width:456px;height:296px" viewBox="0 0 400 260"><path d="M20 210 C 90 30, 170 280, 250 130 S 350 40, 380 80" stroke="#000" stroke-width="40"/><path d="M20 210 C 90 30, 170 280, 250 130 S 350 40, 380 80" stroke="#4da2ff" stroke-width="34"/></svg>
      <svg style="left:40px;top:44px;width:150px;transform:rotate(-14deg)"><use href="#puck" width="100%" height="100%"/></svg>
      <svg style="left:370px;top:40px;width:104px;height:104px;transform:rotate(14deg)"><use href="#star" width="100%" height="100%"/></svg>
      <div class="uni" style="left:34px;right:34px;top:176px;text-align:center;font-size:70px;transform:rotate(-6deg)">
        <span style="display:inline-block;background:#55db9c;border:4px solid #000;border-radius:28px;padding:18px 18px 14px">ЗДАРОВА!</span>
      </div>
      <div class="pill" style="left:118px;top:338px;background:#fff;transform:rotate(4deg)">болельщик</div>
    </div>
  </div>

  <!-- tap: «жми кнопку под сообщением» -->
  <div class="st" id="tap">
    <div class="cut">
      <div class="uni" style="left:0;right:0;top:44px;text-align:center;font-size:124px;transform:rotate(-6deg)">ЖМИ</div>
      <svg style="left:382px;top:26px;width:92px;height:92px;transform:rotate(18deg)"><use href="#star" width="100%" height="100%"/></svg>
      <svg style="left:136px;top:176px;width:240px;height:300px" viewBox="0 0 240 300">
        <path d="M80 12 H160 V160 H226 L120 288 L14 160 H80 Z" fill="#fb4903" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
      </svg>
      <div class="pill" style="left:24px;top:214px;background:#e9ccff;transform:rotate(-8deg);font-size:28px">кнопку</div>
    </div>
  </div>

  <!-- bell: напоминания включены -->
  <div class="st" id="bell">
    <div class="cut">
      <svg style="left:118px;top:36px;width:276px;height:300px;transform:rotate(-12deg)" viewBox="0 0 276 300">
        <path d="M138 28 C 72 28, 58 86, 58 136 C 58 188, 36 206, 22 226 H254 C240 206, 218 188, 218 136 C 218 86, 204 28, 138 28 Z" fill="#ffd731" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
        <circle cx="138" cy="22" r="14" fill="#ffd731" stroke="#000" stroke-width="8"/>
        <path d="M104 238 a34 34 0 0 0 68 0" fill="#000"/>
        <path d="M86 92 C 92 70, 106 60, 122 56" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
      </svg>
      <svg style="left:28px;top:70px;width:70px;height:120px" viewBox="0 0 70 120"><path d="M58 10 C 20 30, 10 70, 30 110 M36 20 C 14 40, 10 70, 20 92" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/></svg>
      <svg style="left:414px;top:70px;width:70px;height:120px;transform:scaleX(-1)" viewBox="0 0 70 120"><path d="M58 10 C 20 30, 10 70, 30 110 M36 20 C 14 40, 10 70, 20 92" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/></svg>
      <div class="uni" style="left:0;right:0;top:340px;text-align:center;font-size:58px;transform:rotate(4deg)">
        <span style="display:inline-block;background:#55db9c;border:4px solid #000;border-radius:9999px;padding:18px 30px 14px">НАПОМНЮ!</span>
      </div>
    </div>
  </div>

  <!-- gameday: утреннее напоминание в день игры -->
  <div class="st" id="gameday">
    <div class="cut">
      <svg style="left:376px;top:196px;width:112px;height:168px;transform:rotate(10deg)"><use href="#stick" width="100%" height="100%"/></svg>
      <div class="pill" style="left:40px;top:70px;background:#fb4903;transform:rotate(-6deg);font-size:40px">сегодня</div>
      <div class="uni" style="left:28px;top:170px;font-size:118px;transform:rotate(-6deg)">ИГРА</div>
      <svg style="left:60px;top:330px;width:190px;height:127px;transform:rotate(-8deg)"><use href="#puck" width="100%" height="100%"/></svg>
      <svg style="left:250px;top:330px;width:84px;height:84px;transform:rotate(-10deg)"><use href="#star" width="100%" height="100%"/></svg>
    </div>
  </div>

  <!-- Эмодзи: рисуются в 512×512, render_stickers.js уменьшает до 100×100 (кастомные эмодзи Telegram).
       Мелкий текст на 100px не читается: только значки и одна-три крупные буквы -->

  <div class="st" id="e-puck">
    <div class="cut"><svg style="left:36px;top:110px;width:440px;height:293px;transform:rotate(-10deg)"><use href="#puck" width="100%" height="100%"/></svg></div>
  </div>

  <div class="st" id="e-stick">
    <div class="cut"><svg style="left:96px;top:36px;width:300px;height:440px;transform:rotate(16deg)"><use href="#stick" width="100%" height="100%"/></svg></div>
  </div>

  <div class="st" id="e-star">
    <div class="cut"><svg style="left:36px;top:36px;width:440px;height:440px;transform:rotate(10deg)"><use href="#star" width="100%" height="100%"/></svg></div>
  </div>

  <div class="st" id="e-goal">
    <div class="cut">
      <div class="uni" style="left:24px;right:24px;top:128px;text-align:center;font-size:150px;transform:rotate(-8deg)">
        <span style="display:inline-block;background:#fb4903;border:6px solid #000;border-radius:40px;padding:34px 14px 24px">ГОЛ!</span>
      </div>
    </div>
  </div>

  <div class="st" id="e-rhl">
    <div class="cut">
      <svg class="ribbon" style="left:34px;top:120px;width:444px;height:288px" viewBox="0 0 400 260"><path d="M20 210 C 90 30, 170 280, 250 130 S 350 40, 380 80" stroke="#000" stroke-width="48"/><path d="M20 210 C 90 30, 170 280, 250 130 S 350 40, 380 80" stroke="#4da2ff" stroke-width="40"/></svg>
      <div class="uni" style="left:0;right:0;top:156px;text-align:center;font-size:176px;transform:rotate(-6deg)">РХЛ</div>
    </div>
  </div>

  <div class="st" id="e-win">
    <div class="cut"><div class="uni" style="left:56px;top:56px;width:400px;height:400px;border-radius:50%;background:#000;color:#fff;display:grid;place-items:center;font-size:260px;padding-top:24px">В</div></div>
  </div>

  <div class="st" id="e-loss">
    <div class="cut"><div class="uni" style="left:56px;top:56px;width:400px;height:400px;border-radius:50%;background:#fff;border:14px solid #000;display:grid;place-items:center;font-size:260px;padding-top:24px">П</div></div>
  </div>

  <div class="st" id="e-home">
    <div class="cut">
      <svg style="left:40px;top:40px;width:432px;height:432px" viewBox="0 0 432 432">
        <path d="M216 30 L402 196 H352 V400 H80 V196 H30 Z" fill="#55db9c" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
        <rect x="170" y="262" width="92" height="138" rx="14" fill="#fff" stroke="#000" stroke-width="12"/>
      </svg>
    </div>
  </div>

  <div class="st" id="e-away">
    <div class="cut">
      <svg style="left:40px;top:40px;width:432px;height:432px;transform:rotate(-30deg)" viewBox="0 0 432 432">
        <path d="M216 24 C 236 24, 246 44, 246 70 V168 L400 250 V300 L246 256 V340 L296 376 V410 L216 390 L136 410 V376 L186 340 V256 L32 300 V250 L186 168 V70 C 186 44, 196 24, 216 24 Z" fill="#e9ccff" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="st" id="e-cup">
    <div class="cut">
      <svg style="left:40px;top:40px;width:432px;height:432px" viewBox="0 0 432 432">
        <path d="M110 70 H40 V120 C 40 180, 80 210, 130 212 M322 70 H392 V120 C 392 180, 352 210, 302 212" fill="none" stroke="#000" stroke-width="16" stroke-linecap="round"/>
        <path d="M100 40 H332 V150 C 332 226, 280 262, 216 262 C 152 262, 100 226, 100 150 Z" fill="#ffd731" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
        <path d="M190 262 H242 V320 H190 Z" fill="#ffd731" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
        <rect x="120" y="320" width="192" height="70" rx="14" fill="#000"/>
        <path d="M150 80 C 150 140, 170 190, 196 214" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div class="st" id="e-fire">
    <div class="cut">
      <svg style="left:56px;top:30px;width:400px;height:452px" viewBox="0 0 400 452">
        <path d="M200 16 C 230 110, 340 150, 340 290 C 340 380, 276 436, 200 436 C 124 436, 60 380, 60 290 C 60 210, 110 170, 128 110 C 150 150, 160 170, 176 180 C 186 120, 180 70, 200 16 Z" fill="#fb4903" stroke="#000" stroke-width="14" stroke-linejoin="round"/>
        <path d="M200 220 C 214 270, 270 290, 270 350 C 270 392, 238 416, 200 416 C 162 416, 130 392, 130 350 C 130 310, 160 290, 170 262 C 180 280, 190 286, 196 290 C 200 262, 192 246, 200 220 Z" fill="#ffd731" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <div class="st" id="e-bell">
    <div class="cut">
      <svg style="left:60px;top:40px;width:392px;height:426px;transform:rotate(-12deg)" viewBox="0 0 276 300">
        <path d="M138 28 C 72 28, 58 86, 58 136 C 58 188, 36 206, 22 226 H254 C240 206, 218 188, 218 136 C 218 86, 204 28, 138 28 Z" fill="#ffd731" stroke="#000" stroke-width="10" stroke-linejoin="round"/>
        <circle cx="138" cy="22" r="14" fill="#ffd731" stroke="#000" stroke-width="10"/>
        <path d="M104 238 a34 34 0 0 0 68 0" fill="#000"/>
      </svg>
    </div>
  </div>

  <script>
    (async function () {
      const s = new URLSearchParams(location.search).get("s");
      if (s) {
        const el = document.getElementById(s);
        if (!el) { document.body.dataset.ready = "missing"; return; }
        el.style.display = "block";
      } else {
        document.body.classList.add("sheet");
      }
      await document.fonts.ready;
      document.body.dataset.ready = "1";
    })();
  </script>
</body>
</html>
