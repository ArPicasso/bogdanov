<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090a">
  <meta name="color-scheme" content="dark">
  <title>РХЛ — матчи и таблица</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="screen" aria-live="polite"></main>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="home" aria-label="Главная">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Главная</span>
    </button>
    <button data-tab="calendar" aria-label="Календарь">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Календарь</span>
    </button>
    <button data-tab="table" aria-label="Таблица">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16M9 4v16"/></svg>
      <span>Таблица</span>
    </button>
    <button data-tab="team" aria-label="Команда">
      <svg viewBox="0 0 24 24"><path d="M12 3.5 5 6v5.5c0 4.3 3 7.7 7 9 4-1.3 7-4.7 7-9V6z"/></svg>
      <span>Команда</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

  <script src="app.js"></script>
</body>
</html>
