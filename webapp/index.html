<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="light">
  <title>РХЛ — матчи и таблица</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@500;700&family=Unbounded:wght@800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="marquee" aria-hidden="true"><div class="marquee-track" id="marquee"></div></div>

  <main id="screen" aria-live="polite"></main>

  <nav class="tabs" id="tabs" hidden>
    <button data-tab="home" aria-label="Главная">
      <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
      <span>Главная</span>
    </button>
    <button data-tab="calendar" aria-label="Календарь">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Календарь</span>
    </button>
    <button data-tab="table" aria-label="Таблица">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>
      <span>Таблица</span>
    </button>
    <button data-tab="team" aria-label="Команда">
      <svg viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
      <span>Команда</span>
    </button>
  </nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></section>

  <script src="app.js"></script>
</body>
</html>
